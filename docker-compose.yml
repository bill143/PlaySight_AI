name: playsight

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: playsight
      POSTGRES_PASSWORD: playsight
      POSTGRES_DB: playsight
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playsight -d playsight"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/playsight &&
      echo 'bucket playsight ready'
      "

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      PLAYSIGHT_ENV: dev
      PLAYSIGHT_DATABASE_URL: postgresql+psycopg2://playsight:playsight@postgres:5432/playsight
      PLAYSIGHT_REDIS_URL: redis://redis:6379/0
      PLAYSIGHT_STORAGE__BACKEND: s3
      PLAYSIGHT_STORAGE__S3_ENDPOINT: http://minio:9000
      PLAYSIGHT_STORAGE__S3_BUCKET: playsight
      PLAYSIGHT_STORAGE__S3_ACCESS_KEY: minioadmin
      PLAYSIGHT_STORAGE__S3_SECRET_KEY: minioadmin
      PLAYSIGHT_AUTH__SECRET_KEY: ${PLAYSIGHT_AUTH__SECRET_KEY:-dev-only-insecure-secret-change-me}
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    environment:
      PLAYSIGHT_ENV: dev
      PLAYSIGHT_DATABASE_URL: postgresql+psycopg2://playsight:playsight@postgres:5432/playsight
      PLAYSIGHT_REDIS_URL: redis://redis:6379/0
      PLAYSIGHT_STORAGE__BACKEND: s3
      PLAYSIGHT_STORAGE__S3_ENDPOINT: http://minio:9000
      PLAYSIGHT_STORAGE__S3_BUCKET: playsight
      PLAYSIGHT_STORAGE__S3_ACCESS_KEY: minioadmin
      PLAYSIGHT_STORAGE__S3_SECRET_KEY: minioadmin
      PLAYSIGHT_AUTH__SECRET_KEY: ${PLAYSIGHT_AUTH__SECRET_KEY:-dev-only-insecure-secret-change-me}
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A playsight.jobs.celery_app inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  dashboard:
    build:
      context: ./dashboard
      dockerfile: ../docker/Dockerfile.dashboard
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
  minio_data:
