[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["backend/alembic/versions", "dashboard"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501: line length handled by formatter.
# B008: FastAPI's Depends()-as-default-argument pattern is intentional.
# UP037: SQLAlchemy relationship() forward refs (e.g. Mapped["Match"]) must stay quoted
#        to avoid circular imports between model modules.
ignore = ["E501", "B008", "UP037"]

[tool.ruff.lint.isort]
known-first-party = ["backend"]

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
